# Each entry renders as a "GET /projects/<key>" row on the homepage.
# Add a project by adding a block here — no JS or HTML to touch.
#
#   key   : url-ish slug shown in the row
#   stack : short tag on the right
#   desc  : one line, shown collapsed
#   body  : the paragraph revealed on expand
#   repo  : optional link

- key: redis-clone
  stack: rust
  desc: a Redis server, from scratch
  repo: https://github.com/anand-dev-parekh
  body: >
    Event loop over mio, a hand-written RESP parser, key expiration, RDB-style
    persistence, and a replication design. Built to see exactly what happens
    between SET and the bytes hitting disk.

- key: query-engine
  stack: rust
  desc: dataframe API over a Volcano executor
  repo: https://github.com/anand-dev-parekh
  body: >
    A query-processing system you drive like a dataframe. Explores the Volcano
    iterator model and a query planner — how a chain of high-level calls becomes
    a tree of operators that pull rows through.

- key: dev-platform
  stack: next.js
  desc: the internal platform architects build on
  body: >
    Full-stack internal developer platform at Mastercard. Design microservices,
    wire up service-to-service mTLS, and self-serve VM / bare-metal provisioning
    — the paved road from "I need a service" to a running deployment.
