# Roles, most recent first. Plain reverse-chronological — no framing device.
#
#   role    : your title
#   org     : company / lab / school
#   dates   : free text, shown right-aligned
#   place   : optional location
#   current : true draws the "now" dot
#   body    : one or two sentences
#   logo    : path under /assets/img/logos/. Safe to name a file that isn't
#             there yet — the row falls back to the monogram until it is.
#   mark    : the monogram used until a logo lands
#   plate   : "light" for dark-ink logos that need a light chip behind them
#
# NOTE: the earlier roles are still one thin line each — I only wrote what your
# old index.md stated. A concrete sentence about what you built would help most.

